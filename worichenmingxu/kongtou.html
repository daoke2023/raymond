<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量空投管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
    :root {
        --bg: #0b1020; --panel: #141a2e; --line: #25304f; --txt: #e8ecf7;
        --primary: #5b8cff; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: var(--bg); color: var(--txt); font-family: system-ui, sans-serif;
        padding: 30px 20px; display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
    
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; color: #fff; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input, select { width: 100%; background: #0f1528; border: 1px solid var(--line); color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: var(--primary); }
    
    .btn {
        background: var(--primary); color: #fff; border: none; padding: 12px 20px;
        border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;
        transition: 0.2s; font-size: 15px;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.1); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.success { background: var(--success); }
    .btn.warning { background: var(--warning); color: #000; }

    .status-badge { font-size: 13px; padding: 4px 10px; border-radius: 20px; background: #333; }
    .status-ok { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }

    textarea {
        width: 100%; height: 250px; background: #0f1528; border: 1px solid var(--line);
        color: #fff; padding: 12px; border-radius: 8px; font-family: monospace;
        font-size: 13px; outline: none; resize: vertical; line-height: 1.6;
    }

    .log-box {
        background: #090b10; border: 1px solid var(--line); border-radius: 8px;
        padding: 15px; height: 200px; overflow-y: auto; font-family: monospace;
        font-size: 13px; margin-top: 15px; line-height: 1.6; color: #94a3b8;
    }
    .log-success { color: var(--success); }
    .log-error { color: var(--danger); }
    .log-warn { color: var(--warning); }
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>
            🪂 批量空投管理工具
            <span id="walletStatus" class="status-badge">未连接</span>
        </h1>
        <button class="btn" id="connectBtn" onclick="connectWallet()">🔌 连接 Owner 钱包</button>
    </div>

    <div class="card">
        <h2 style="font-size:16px; margin-bottom:15px; color:var(--primary);">⚙️ 基础配置</h2>
        <div class="form-group">
            <label>代币合约地址</label>
            <input type="text" id="tokenAddress" placeholder="0x..." />
        </div>
        <div class="form-group">
            <label>空投合约地址 (部署 BatchAirdrop 后的地址)</label>
            <input type="text" id="airdropAddress" placeholder="0x..." />
        </div>
        <div class="form-group">
            <label>每个地址空投数量 (会自动乘上代币精度)</label>
            <input type="number" id="amountPerUser" value="1000" />
        </div>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="btn warning" id="approveBtn" onclick="approveToken()">1️⃣ 第一步：授权代币</button>
            <button class="btn success" id="startAirdropBtn" onclick="startAirdrop()">2️⃣ 第二步：开始批量空投</button>
        </div>
    </div>

    <div class="card">
        <h2 style="font-size:16px; margin-bottom:15px; color:var(--primary);">📋 接收地址名单</h2>
        <p style="font-size:12px; color:#94a3b8; margin-bottom:10px;">
            将你刚导出的 CSV 地址直接粘贴进来（支持纯地址，或 `地址,数量` 的格式，每行一个）。<br>
            <b style="color:var(--warning);">⚠️ 提示：单次最多处理 300 个地址，系统会自动分批打包发送。</b>
        </p>
        <textarea id="addressList" placeholder="0x123...&#10;0x456...&#10;或者&#10;0x123..., 500"></textarea>
    </div>

    <div class="card">
        <h2 style="font-size:16px; margin-bottom:15px; color:var(--primary);">📝 运行日志</h2>
        <div class="log-box" id="logBox">等待操作...</div>
    </div>
</div>

<script>
    // ============ 核心配置 ============
    // 空投合约 ABI
    const AIRDROP_ABI = [
        "function airdropSameToken(address token, address[] recipients, uint256[] amounts) external"
    ];
    // ERC20 基础 ABI
    const ERC20_ABI = [
        "function decimals() view returns (uint8)",
        "function balanceOf(address) view returns (uint256)",
        "function allowance(address owner, address spender) view returns (uint256)",
        "function approve(address spender, uint256 amount) returns (bool)"
    ];

    let provider, signer, userAddress;
    let tokenContract, airdropContract;

    const $ = id => document.getElementById(id);

    function log(msg, type = 'info') {
        const box = $('logBox');
        const el = document.createElement('div');
        el.className = `log-${type}`;
        el.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
    }

    async function connectWallet() {
        if (!window.ethereum) return alert("请安装 MetaMask 或 TP 钱包");
        try {
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            provider = new ethers.providers.Web3Provider(window.ethereum, "any");
            signer = provider.getSigner();
            userAddress = await signer.getAddress();

            const net = await provider.getNetwork();
            if (net.chainId !== 56) return alert("请切换到 BSC 主网");

            $('walletStatus').innerText = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            $('walletStatus').className = "status-badge status-ok";
            $('connectBtn').style.display = "none";
            log("✅ 钱包已连接: " + userAddress, 'success');
        } catch (e) {
            alert("连接失败: " + e.message);
        }
    }

    // 授权代币给空投合约
    async function approveToken() {
        const tokenAddr = $('tokenAddress').value.trim();
        const airdropAddr = $('airdropAddress').value.trim();

        if (!ethers.utils.isAddress(tokenAddr) || !ethers.utils.isAddress(airdropAddr)) {
            return alert("请填写正确的代币地址和空投合约地址！");
        }

        try {
            const btn = $('approveBtn');
            btn.disabled = true; btn.innerText = "授权中...";

            tokenContract = new ethers.Contract(tokenAddr, ERC20_ABI, signer);
            
            // 无限授权
            const tx = await tokenContract.approve(airdropAddr, ethers.constants.MaxUint256);
            log("⏳ 正在等待授权交易确认...", 'warn');
            await tx.wait();
            
            log("✅ 代币授权成功！可以进行空投了。", 'success');
            alert("授权成功！");
        } catch (e) {
            log("❌ 授权失败: " + (e.reason || e.message), 'error');
            alert("授权失败: " + (e.reason || e.message));
        } finally {
            $('approveBtn').disabled = false; $('approveBtn').innerText = "1️⃣ 第一步：授权代币";
        }
    }

    // 开始批量空投
    async function startAirdrop() {
        const tokenAddr = $('tokenAddress').value.trim();
        const airdropAddr = $('airdropAddress').value.trim();
        const baseAmount = parseFloat($('amountPerUser').value);
        const text = $('addressList').value.trim();

        if (!ethers.utils.isAddress(tokenAddr) || !ethers.utils.isAddress(airdropAddr)) {
            return alert("请检查代币地址和空投合约地址！");
        }
        if (!text) return alert("请粘贴需要空投的地址列表！");

        const btn = $('startAirdropBtn');
        btn.disabled = true; btn.innerText = "空投执行中...";

        try {
            tokenContract = new ethers.Contract(tokenAddr, ERC20_ABI, signer);
            airdropContract = new ethers.Contract(airdropAddr, AIRDROP_ABI, signer);

            // 读取代币精度
            const decimals = await tokenContract.decimals();
            const amountWei = ethers.utils.parseUnits(baseAmount.toString(), decimals);

            // 解析地址列表
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            let allAddresses = [];
            
            for (let line of lines) {
                // 支持 CSV 格式 "0x...,100"
                const parts = line.split(',');
                const addr = parts[0].trim();
                if (ethers.utils.isAddress(addr)) {
                    allAddresses.push(addr);
                }
            }

            if (allAddresses.length === 0) throw new Error("未提取到任何有效地址！");

            // 检查余额
            const balance = await tokenContract.balanceOf(userAddress);
            const totalNeeded = amountWei.mul(allAddresses.length);
            if (balance.lt(totalNeeded)) {
                throw new Error(`余额不足！需要 ${ethers.utils.formatUnits(totalNeeded, decimals)} 代币，当前只有 ${ethers.utils.formatUnits(balance, decimals)}`);
            }

            log(`📡 开始处理 ${allAddresses.length} 个地址，共分 ${Math.ceil(allAddresses.length / 200)} 笔交易...`, 'warn');

            // 分批发送，每批 200 个
            const BATCH_SIZE = 200;
            let successCount = 0;

            for (let i = 0; i < allAddresses.length; i += BATCH_SIZE) {
                const batch = allAddresses.slice(i, i + BATCH_SIZE);
                // 给这批地址每人分配一样的数量
                const amounts = new Array(batch.length).fill(amountWei);

                log(`⏳ 正在发送第 ${Math.floor(i/BATCH_SIZE) + 1} 批，包含 ${batch.length} 个地址...`, 'info');

                const tx = await airdropContract.airdropSameToken(tokenAddr, batch, amounts);
                await tx.wait();
                
                successCount += batch.length;
                log(`✅ 第 ${Math.floor(i/BATCH_SIZE) + 1} 批空投完成 (已成功 ${successCount} 人)`, 'success');
                
                // 稍微停顿，防止节点卡顿
                if (i + BATCH_SIZE < allAddresses.length) {
                    await new Promise(r => setTimeout(r, 2000));
                }
            }

            log(`🎉 空投全部完成！共成功分发给 ${successCount} 个地址。`, 'success');
            alert(`空投完成！共发送 ${successCount} 个地址。`);

        } catch (e) {
            log("❌ 空投失败: " + (e.reason || e.message), 'error');
            alert("空投失败: " + (e.reason || e.message));
        } finally {
            btn.disabled = false; btn.innerText = "2️⃣ 第二步：开始批量空投";
        }
    }
</script>
</body>
</html>
